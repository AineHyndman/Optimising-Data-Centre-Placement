stages:
  - lint
  - test
  - build
  - deploy

# --- Lint stage: runs on ALL branches ---

frontend_lint:
  stage: lint
  tags:
    - docker
  image: node:20-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm run lint
    - npm run build

backend_lint:
  stage: lint
  tags:
    - docker
  image: python:3.11-slim
  cache:
    key: pip-backend-v1
    paths:
      - .pip/
  before_script:
    - cd backend
    - pip install --cache-dir ../.pip -r requirements.txt
  script:
    - python -c "from main import app; print('Backend import OK')"

# --- Test stage: runs on ALL branches ---

backend_tests:
  stage: test
  tags:
    - docker
  image: python:3.11-slim
  cache:
    key: pip-backend-v1
    paths:
      - .pip/
  before_script:
    - cd backend
    - pip install --cache-dir ../.pip -r requirements.txt
  script:
    - python -m pytest tests/ -v

# --- Build stage: only on main (uses Kaniko — no privileged runner needed) ---

build_backend:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - cp "$GCP_SA_KEY" /kaniko/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/kaniko/gcp-key.json
    - |
      cat > /kaniko/.docker/config.json << EOF
      {"credHelpers":{"europe-north1-docker.pkg.dev":"gcr"}}
      EOF
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/backend:${CI_COMMIT_SHA}"
      --destination "europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/backend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build_frontend:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - cp "$GCP_SA_KEY" /kaniko/gcp-key.json
    - export GOOGLE_APPLICATION_CREDENTIALS=/kaniko/gcp-key.json
    - |
      cat > /kaniko/.docker/config.json << EOF
      {"credHelpers":{"europe-north1-docker.pkg.dev":"gcr"}}
      EOF
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/frontend:${CI_COMMIT_SHA}"
      --destination "europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/frontend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_backend:
  stage: deploy
  tags:
    - docker
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - gcloud config set project $GCP_PROJECT
    - gcloud run deploy backend
      --image europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/backend:${CI_COMMIT_SHA}
      --region europe-north1
      --platform managed
      --allow-unauthenticated
      --port 8000

deploy_frontend:
  stage: deploy
  tags:
    - docker
  image: google/cloud-sdk:slim
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - gcloud config set project $GCP_PROJECT
    - gcloud run deploy frontend
      --image europe-north1-docker.pkg.dev/${GCP_PROJECT}/dcp/frontend:${CI_COMMIT_SHA}
      --region europe-north1
      --platform managed
      --allow-unauthenticated
      --port 5173
