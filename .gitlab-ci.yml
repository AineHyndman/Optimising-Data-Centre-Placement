stages:
  - lint
  - build

# --- Lint stage: runs on ALL branches ---

frontend_lint:
  stage: lint
  tags:
    - docker
  image: node:20-alpine
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - .npm/
  before_script:
    - cd frontend
    - npm ci --cache ../.npm --prefer-offline
  script:
    - npm run lint
    - npm run build

backend_lint:
  stage: lint
  tags:
    - docker
  image: python:3.11-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .pip/
  before_script:
    - cd backend
    - pip install --no-cache-dir --cache-dir ../.pip -r requirements.txt
  script:
    - python -c "from main import app; print('Backend import OK')"

# --- Build stage: only on main (uses Kaniko — no privileged runner needed) ---

build_backend:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/backend"
      --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/backend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build_frontend:
  stage: build
  tags:
    - docker
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf "%s:%s" "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "${CI_PROJECT_DIR}/frontend"
      --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile"
      --destination "${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHA}"
      --destination "${CI_REGISTRY_IMAGE}/frontend:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
